<h1 class="mb-5">Component Baum</h1>

<button type="button" (click)="addComponent()" class="btn btn-primary">Neue Component hinzufügen</button>
<button type="button" (click)="removeComponent()" class="btn btn-primary ms-3">Letzte Component entfernen</button>

<hr>

@for (compNr of componentNumbers(); track $index) {
<div class="d-inline-flex mb-3 me-3">
  <app-child [componentNumber]="compNr" (numberReport)="showComponentNr($event)"></app-child>
</div>
}
